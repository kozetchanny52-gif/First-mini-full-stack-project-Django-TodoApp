{% extends "root.html" %}
{% load static %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'home/bootstrap-icons/bootstrap-icons.css' %}">
<link rel="stylesheet" href="{% static 'home/index.css' %}">
{% endblock %}

{% block content %}
<div  class="d-flex justify-content-center flex-column align-items-center p-4 mt-5">
    <form method="post" action="{% url 'login' %}" class="d-flex flex-column align-items-center border border-1 border-primary p-4 rounded-5 bg-light h-auto" style="gap: 2em;">
        {% csrf_token %}
        <h1 class="font-monospace text-light fw-bolder w-100 text-center text-primary-emphasis rounded-end-5">Sign in</h1>
        <div class="input-group w-15">
            <span class="input-group-text bg-primary">
                <i class="bi bi-person-fill text-light"></i>
            </span>
            <input type="text" name="username" class="p-2" placeholder="Enter your username" style="outline:none;border: none;">
        </div>
        <div class="input-group w-10">
            <span class="input-group-text bg-primary">
                <i class="bi bi-key-fill text-light"></i>
            </span>
            <input type="password" name="password" class="p-2 " style="outline:none;border: none;" placeholder="Enter your password">
            <button type="button" class="toggle-password" aria-label="Show password" data-target="password1">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <p>no account ?<a href="{% url 'register' %}" class="border-0 shadow-none">Sign up</a></p>
        {% if messages %}
            {% for message in messages %}
                <div class="message {{message.tags}}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <button class="btn btn-success p-2 w-40 font-monospace">Login</button>
    </form>
</div>
{% endblock %}
